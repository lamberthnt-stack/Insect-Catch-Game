<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Catch The Insect</title>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="screen">
      <h1>Catch The Insect</h1>
      <button class="btn" id="start-btn">Play Game</button>
    </div>

    <div class="screen">
      <h1>What's your "Favorite" Insect?</h1>
      <ul class="insects-list">
        <li>
          <button class="choose-insect-btn">
            <p>butterfly</p>
            <img src="images/butterfly.jpg" 
            alt="butterfly"
            />
          </button>
        </li>
        <li>
          <button class="choose-insect-btn">
            <p>praying mantis</p>
            <img
               src="images/praying-mantis.jpg"
               alt="praying mantis"
               /> 
          </button>
        </li>
        <li>
          <button class="choose-insect-btn">
            <p>ladybug</p>
            <img
               src="images/ladybug.jpg"
               alt="ladybug"
               />
          </button>
        </li>
        <li>
          <button class="choose-insect-btn">
            <p>grasshopper</p>
            <img
               src="images/grasshopper.jpg"
               alt="grasshopper"
               />
          </button>
        </li>
      </ul>
    </div>

    <div class="screen game-container" id="game-container">
      <h3 id="time" class="time">Time: 00:00</h3>
      <h3 id="score" class="score">Score: 0</h3>
      <h5 id="message" class="message">
        Are you annoyed yet? <br>
        You are playing an tricky game!
      </h5>
    </div>
  </body>
</html>
